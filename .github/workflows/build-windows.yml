name: build-windows
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: pnpm config (match lockfile)
        working-directory: app
        run: pnpm config set only-built-dependencies false

      - name: Install deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        working-directory: app
        run: pnpm exec electron-rebuild -f

      - name: Compute and inject version
        id: ver
        shell: pwsh
        working-directory: app
        run: |
          # Always compute version as: <major>.<minor>.<commitCount>
          # Where <major>.<minor> comes from app/package.json, and commitCount is total commits in repo.

          # Read base version from package.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $base = if ($pkg.version) { $pkg.version } else { '0.1.0' }

          # Extract major.minor (fallback to 0.1)
          $parts = $base.Split('.')
          if ($parts.Length -lt 2) { $parts = @('0','1','0') }
          $major = [int]$parts[0]
          $minor = [int]$parts[1]

          # Compute ascending number (commit count)
          $commitCount = (git rev-list --count HEAD).Trim()

          $version = "$major.$minor.$commitCount"

          # Export for subsequent steps
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Inject into package.json
          $pkg.version = $version
          ($pkg | ConvertTo-Json -Depth 100) | Set-Content package.json -Encoding UTF8
          Write-Host "Injected version: $version"

      - name: Build installer (x64)
        working-directory: app
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: pnpm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: lotech-win-x64-installer
          path: |
            app/dist/*.exe
            app/dist/latest.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.detect.outputs.asset_name }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: lotech-win-x64-installer
          path: release

      - name: Detect asset filename
        id: detect
        run: |
          set -e
          FILE=$(ls release/*.exe | head -n1)
          BASENAME=$(basename "$FILE")
          echo "asset_name=$BASENAME" >> $GITHUB_OUTPUT

      - name: Publish assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Lotech v${{ needs.build.outputs.version }}
          files: |
            release/*.exe
            release/latest.yml

  notify:
    needs: [build, release]
    runs-on: windows-latest
    environment: production
    steps:
      - name: Compose and send Discord notification
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          TAG_NAME: v${{ needs.build.outputs.version }}
          ASSET_NAME: ${{ needs.release.outputs.asset_name }}
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}/${{ needs.release.outputs.asset_name }}
        run: |
          if (-not $env:DISCORD_WEBHOOK) {
            Write-Host "No DISCORD_WEBHOOK configured in environment 'production'"; exit 0
          }

          $shortSha = $env:GITHUB_SHA.Substring(0,7)
          $releaseUrl = "https://github.com/$($env:REPO)/releases/tag/$($env:TAG_NAME)"
          $downloadUrl = $env:DOWNLOAD_URL

          $title = "💊 Nueva versión disponible"
          $desc = "Ya está lista la versión **$env:VERSION** de la aplicación. Pueden descargarla desde el enlace a continuación."

          $embed = [ordered]@{
            title       = $title
            description = $desc
            color       = 3066993
            fields      = @(
              @{ name = 'Versión'; value = $env:VERSION; inline = $false },
              @{ name = 'Descarga'; value = $downloadUrl; inline = $false }
            )
            timestamp   = (Get-Date).ToString('o')
          }

          $payload = @{ embeds = @($embed) } | ConvertTo-Json -Depth 6

          try {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload | Out-Null
          } catch {
            Write-Host "Failed to post to Discord: $($_.Exception.Message)"
          }
